<!DOCTYPE html>    
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>БЛАГОДАРЮ</title>
    <style>
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body, h1, h2, label, button {
        font-family: 'MyCustomFont', Arial, sans-serif;
        cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
    }
    
    body {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #671c1c;
        color: white;
    }
    
    h1 {
        text-align: center;
        color: #FFD700;
        font-size: 2.5em;
        margin-bottom: 30px;
    }
    
    h2 {
        color: #FFA500;
        font-size: 1em;
        font-style: italic;
        margin: 10px 0;
        background: rgba(139, 69, 19, 0.7);
        padding: 8px;
        border-radius: 8px;
    }
    
    .cat-image {
        background: linear-gradient(45deg, #043b46, #459caf);
        border-style: dashed;
        border-width: 2px;
        border-color: #57646b;
        border-radius: 20px;
        font-size: 1.3em;
        font-weight: bold;
        margin-top: 50px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    
</style>
</head>
<body>
  <h1>СПАСИБО ЗА ОТВЕТЫ!</h1>
  <h2>ПОСТАРАЮСЬ УЧЕСТЬ ВСЕ ПОЖЕЛАНИЯ! &#x1F970;</h2>
  <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsiksexxx.png">
  alt="басичок"
  class="cat-image">
</body>
</html>
