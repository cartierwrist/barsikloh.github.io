<!DOCTYPE html>    
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>БЛАГОДАРЮ</title>
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png" />
    <style>
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body, h1, h2, label, button {
        font-family: 'MyCustomFont', Arial, sans-serif;
        cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
    }
    
    body {
        background: linear-gradient(45deg, #043b46, #459caf);
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        color: white;
        text-align: center;
    }
    
    h1 {
        text-align: center;
        color: #a5efef;
        background: #928226;
        font-size: 2.5em;
        margin-bottom: 30px;
    }
    
    h2 {
        color: #a5efef;
        font-size: 1em;
        margin: 10px 0;
        background: #928226;
        padding: 8px;
        border-radius: 8px;
    }
    
    .cat-image {
        border: 2px dashed #57646b;
        border-radius: 20px;
        max-width: 500px;
        width: 100%;
        height: auto;
        display: block;
        margin: 50px auto;
    }
</style>
</head>
<body>
  <h1>СПАСИБО ЗА ОТВЕТЫ!</h1>
  <h2>ПОСТАРАЮСЬ УЧЕСТЬ ВСЕ ПОЖЕЛАНИЯ! &#x1F970;</h2>
  <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsiksexxx.png"
      alt="басичок"
      class="cat-image">
</body>
</html>
