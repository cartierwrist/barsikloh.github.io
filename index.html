<!DOCTYPE html>    
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СОЦОПРОС</title>
    <style>
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body, h1, h2, label, button {
        font-family: 'MyCustomFont', Arial, sans-serif;
        cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
    }
    
    body {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #671c1c;
        color: white;
    }
    
    label {
        display: block;
        margin: 15px 0 8px 0;
        font-weight: bold;
        color: #FFD700;
        font-size: 1.2em;
    }
    
    h1 {
        text-align: center;
        color: #FFD700;
        font-size: 2.5em;
        margin-bottom: 30px;
    }
    
    h2 {
        color: #FFA500;
        font-size: 1em;
        font-style: italic;
        margin: 10px 0;
        background: rgba(139, 69, 19, 0.7);
        padding: 8px;
        border-radius: 8px;
    }
    
    input[type="text"] {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 2px solid #D2691E;
        border-radius: 8px;
        background: #FFF8DC;
        font-size: 1.1em;
        box-sizing: border-box;
    }
    
    input[type="text"]:focus {
        outline: none;
        border-color: #FFD700;
        box-shadow: 0 0 10px #FFD700;
    }
    
    button {
        background: linear-gradient(45deg, #FFD700, #FFA500);
        color: #8B4513;
        padding: 15px 40px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1.3em;
        font-weight: bold;
        margin-top: 20px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    
    #message {
        text-align: center;
        margin-top: 20px;
        font-size: 1.2em;
        font-weight: bold;
    }
</style>
</head>
<body>
    <h1>Выбери, что ты хочешь :)</h1>
    <form id="surveyForm" action="https://submit-form.com/5N2gD1FtH" method="POST">
    <input type="hidden" name="_redirect" value="https://cartierwrist.github.io/barsikloh.github.io/">
    
        <label>Твое имя:</label>
        <input type="text" id="name" name="name" required placeholder="Введите имя (настоящее, барсиком пж не называться): ">

        <label>Какая пицца?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ ПИЦЦУ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
        <input type="text" id="answer1" name="answer1" required placeholder="Например: Маргарита, Пепперони, Не буду">

        <label>Какие роллы?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ РОЛЛЫ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
        <input type="text" id="answer2" name="answer2" required placeholder="Например: Филадельфия, Калифорния, Не буду">

        <label>Что из напитков?</label>
        <h2>АЛКОГОЛЬ</h2>
        <input type="text" id="answer3" name="answer3" required placeholder="Например: Пиво, Вино, Не буду">
        <h2>НЕ АЛКОГОЛЬ</h2>
        <input type="text" id="answer4" name="answer4" required placeholder="Например: Кола, Сок, Вода">

        <label>Иные пожелания:</label>
        <h2>[можете писать что угодно]</h2>
        <input type="text" id="answer5" name="answer5" placeholder="Ваши пожелания...">

        <input type="hidden" name="_redirect" value="https://cartierwrist.github.io/barsikloh.github.io/">
        
        <button type="submit">Отправить ответ</button>
    </form>
    <div id="message"></div>

    <script>
    const form = document.getElementById('surveyForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        messageDiv.innerHTML = `
            <div style="background: #a6d8db; padding: 30px; border-radius: 15px; border: 3px solid #003e6c; text-align: center; color: white;">
                <h1 style="color: #117f86;">БЛАГОДАРЮ</h1>
                <p style="font-size: 1.3em; color: #063c40;">Я ОЧЕНЬ ПОСТАРАЮСЬ УЧЕСТЬ ВСЕ ПОЖЕЛАНИЯ</p>
                
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsiksexxx.png" 
                     alt="БАСИЧОК" 
                     style="max-width: 300px; border-radius: 15px; border: 3px solid #507379; margin: 20px 0;">
            </div>
        `;
        
        const formData = new FormData(form);
        
        try {
            await fetch(form.action, {
                method: 'POST',
                body: formData
            });
            
            form.reset();
            
        } catch (error) {
            console.error('КАПЕЦ', error);
        }
    });
    </script>
</body>
</html>
