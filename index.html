<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СОЦОПРОС</title>
    <style>
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://ваш_логин.github.io/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
    
    body, h1 {
        font-family: 'MyCustomFont', Arial, sans-serif !important;
    }
</style>
</head>
<body>
    <h1>Выбери, что ты хочешь :)</h1>
    <form id="surveyForm">
        <label>Какая пицца?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ ПИЦЦУ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
        <input type="email" id="email" name="email" required>

        <label>Какие роллы?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ РОЛЛЫ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
        <input type="text" id="answer1" name="answer1" required>

        <label>Что из напитков?</label>
        <h2>АЛКОГОЛЬ</h2>
        <input type="text" id="answer2" name="answer2" required>
        <h2>НЕ АЛКОГОЛЬ</h2>
        <input type="text" id="answer3" name="answer3" required>

        <label>Иные пожелания:</label>
        <h2>[можете писать что угодно]</h2>
        <input type="text" id="answer4" name="answer4" required>

        <button type="submit">Отправить ответ</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById('surveyForm');
        const messageDiv = document.getElementById('message');

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7DLrk1QjG_gqmRKZkdpw_CM5WRkzN2fVqp7iT4ZcYCnkEDS3HL-lOuAk3mRdzdcFT/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                email: document.getElementById('email').value,
                answer1: document.getElementById('answer1').value,
                answer2: document.getElementById('answer2').value,
                answer3: document.getElementById('answer3').value,
                answer4: document.getElementById('answer4').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    messageDiv.innerHTML = '<p style="color: green;">Спасибо за ответы! Постараюсь учесть все пожелания</p>';
                    form.reset();
                } else {
                    throw new Error(data.error);
                }
            })
            .catch(error => {
                console.error('Error!', error);
                messageDiv.innerHTML = '<p style="color: red;">Чет пошло не так((( попробуй еще раз, бро</p>';
            });
        });
    </script>
</body>
</html>
