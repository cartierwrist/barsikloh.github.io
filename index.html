<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пизда</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <meta name="theme-color" content="#FFD700">
    
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body, * {
            cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
        }

        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #FFD700;
            color: #671c1c;
            font-family: 'MyCustomFont', Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 30px; /* Отступ до картинки, когда она появится */
        }

        button {
            background: linear-gradient(45deg, #671c1c, #8B4513);
            color: #FFD700;
            padding: 15px 50px;
            border: 3px solid #671c1c;
            border-radius: 25px;
            cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_hand_page_02.png'), pointer !important;
            font-size: 1.5em;
            font-family: 'MyCustomFont', Arial, sans-serif;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #8B4513, #A0522D);
        }

        #nazar-image {
            max-width: 100%;
            width: 400px;
            border: 5px solid #671c1c;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(103, 28, 28, 0.3);
        }

        /* Класс для скрытия элементов */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    
    <div id="question-block">
        <h1>ваше имя начинается на "н" и заканчивается на "азар"?</h1>
        <div class="btn-group">
            <button onclick="showNazar()">Да</button>
            <button onclick="goToSurvey()">Нет</button>
        </div>
    </div>


    <div id="nazar-block" class="hidden">
        <img id="nazar-image" src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/nazar.png" alt="Назар">
    </div>

    <script>
        function showNazar() {
           
            document.getElementById('nazar-block').classList.remove('hidden');
        }

        function goToSurvey() {
           
            window.location.href = 'https://cartierwrist.github.io/barsikloh.github.io/sots.html';
        }
    </script>
</body>
</html>
