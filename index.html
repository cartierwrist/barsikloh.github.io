<!DOCTYPE html>    
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СОЦОПРОС</title>

    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#FFD700" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png">

    <meta name="msapplication-TileColor" content="#FFD700" />
    <meta name="msapplication-TileImage" content="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/barsikforicon.png" />
    <meta name="theme-color" content="#FFD700" />
    
    <link rel="manifest" href="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/manifest.json">
    
    <meta name="theme-color" content="#FFD700">
    
    <style>
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body, h1, h2, label, button {
        font-family: 'MyCustomFont', Arial, sans-serif;
        cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
    }
    
    body {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #671c1c;
        color: white;
    }
    
    label {
        display: block;
        margin: 15px 0 8px 0;
        font-weight: bold;
        color: #FFD700;
        font-size: 1.2em;
    }
    
    h1 {
        text-align: center;
        color: #FFD700;
        font-size: 2.5em;
        margin-bottom: 30px;
    }
    
    h2 {
        color: #FFA500;
        font-size: 1em;
        font-style: italic;
        margin: 10px 0;
        background: #a55103;
        padding: 8px;
        border-radius: 8px;
    }
    
    input[type="text"] {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 2px solid #D2691E;
        border-radius: 8px;
        background: #FFF8DC;
        font-size: 1.1em;
        box-sizing: border-box;
    }
    
    input[type="text"]:focus {
        outline: dashed 5px #752407;
        border-color: #86685e;
        box-shadow: 0 0 10px #d1694a;
    }

     .option-name {
        margin-top: 8px;
        font-size: 0.9em;
        color: #fcdea4;
    }

    .image-options {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin: 15px 0;
        justify-content: center;
    }
    
    .option-item {
        text-align: center;
        cursor: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/Hornet_alt_page_01.png'), auto !important;
    }
    
    .option-image {
        width: 120px;
        height: 120px;
        border: 3px solid #966405;
        border-radius: 15px;
        object-fit: contain;
        transition: all 0.3s ease;
    }
    
    .option-item input[type="checkbox"] {
        display: none;
    }
    
    .option-item input[type="checkbox"]:checked + .option-image {
        border-color: #FFD700;
        box-shadow: 0 0 15px #FFD700;
        transform: scale(1.05);
    }
        
    button {
        background: linear-gradient(45deg, #FFD700, #FFA500);
        color: #8B4513;
        padding: 15px 40px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1.3em;
        font-weight: bold;
        margin-top: 20px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    
    #message {
        text-align: center;
        margin-top: 20px;
        font-size: 1.2em;
        font-weight: bold;
    }
</style>
</head>
<body>
    <h1>Выбери, что ты хочешь :)</h1>
    <form id="surveyForm" action="https://submit-form.com/5N2gD1FtH" method="POST">
    <input type="hidden" name="_redirect" value="https://cartierwrist.github.io/barsikloh.github.io/thanks.html">
    
        <label>Твое имя:</label>
        <input type="text" id="name" name="name" required placeholder="Введите имя (настоящее, барсиком пж не называться): ">

        <label>Какая пицца?</label>
        <h2>ЕСЛИ ТЫ НЕ ХОЧЕШЬ ПИЦЦУ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ</h2>
        
        <div class="image-options" id="pizza-options">
            
            <label class="option-item">
                <input type="checkbox" name="pizza" value="Четыре сыра">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/4cheese.png" class="option-image">
                <div class="option-name">Четыре сыра</div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="pizza" value="Аррива!">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/arriva.png" class="option-image">
                <div class="option-name">Аррива!</div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="pizza" value="Бефстроганов">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/beff.png" class="option-image">
                <div class="option-name">Бефстроганов</div>
            </label>

             <label class="option-item">
                <input type="checkbox" name="pizza" value="Бургер-пицца">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/burgerpizza.png" class="option-image">
                <div class="option-name">Бургер-пицца</div>
            </label>

             <label class="option-item">
                <input type="checkbox" name="pizza" value="Сырный цыпленок">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/cheese_chiken.png" class="option-image">
                <div class="option-name">Сырный цыпленок</div>
            </label>

             <label class="option-item">
                <input type="checkbox" name="pizza" value="Цыпленок барбекю">
                <img src="https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/pizza/chiken_barbek.png" class="option-image">
                <div class="option-name">Цыпленок барбекю</div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="pizza" value="НЕ БУДУ" id="noPizza">
                <div class="no-thanks" id="noPizzaBtn">🚫</div>
                <div class="option-name">НЕ БУДУ</div>
            </label>
        </div>

        <label>Какие роллы?</label>
        <h2>ЕСЛИ ТЫ НЕ ХОЧЕШЬ РОЛЛЫ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ</h2>
        <input type="text" id="answer2" name="answer2" required placeholder="Например: Филадельфия, Калифорния, Не буду">

        <label>Что из напитков?</label>
        <h2>АЛКОГОЛЬ</h2>
        <input type="text" id="answer3" name="answer3" required placeholder="Например: Пиво, Вино, Не буду">
        <h2>НЕ АЛКОГОЛЬ</h2>
        <input type="text" id="answer4" name="answer4" required placeholder="Например: Кола, Сок, Вода">

        <label>Иные пожелания:</label>
        <h2>можете писать что угодно</h2>
        <input type="text" id="answer5" name="answer5" placeholder="Ваши пожелания...">

        <button type="submit">Отправить ответ</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById('surveyForm');
        const messageDiv = document.getElementById('message');

        document.getElementById('noPizzaBtn').addEventListener('click', function() {
            const noPizzaCheckbox = document.getElementById('noPizza');
            const pizzaCheckboxes = document.querySelectorAll('input[name="pizza"]:not(#noPizza)');
            
            noPizzaCheckbox.checked = !noPizzaCheckbox.checked;
            
            if (noPizzaCheckbox.checked) {
                this.classList.add('checked');
                pizzaCheckboxes.forEach(cb => cb.checked = false);
            } else {
                this.classList.remove('checked');
            }
        });

        document.getElementById('noRollsBtn').addEventListener('click', function() {
            const noRollsCheckbox = document.getElementById('noRolls');
            const rollsCheckboxes = document.querySelectorAll('input[name="rolls"]:not(#noRolls)');
            
            noRollsCheckbox.checked = !noRollsCheckbox.checked;
            
            if (noRollsCheckbox.checked) {
                this.classList.add('checked');
                rollsCheckboxes.forEach(cb => cb.checked = false);
            } else {
                this.classList.remove('checked');
            }
        });

        document.querySelectorAll('input[name="pizza"]:not(#noPizza)').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    document.getElementById('noPizza').checked = false;
                    document.getElementById('noPizzaBtn').classList.remove('checked');
                }
            });
        });

        document.querySelectorAll('input[name="rolls"]:not(#noRolls)').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    document.getElementById('noRolls').checked = false;
                    document.getElementById('noRollsBtn').classList.remove('checked');
                }
            });
        });

        form.addEventListener('submit', function(e) {
            messageDiv.innerHTML = '<p style="color: blue;">📤 отправка данных...</p>';
            messageDiv.style.backgroundColor = '#e6f7ff';
        });
    </script>
</body>
</html>
