<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СОЦОПРОС</title>
    <style>
        h1 {
        color: red;
      }
    @font-face {
        font-family: 'MyCustomFont';
        src: url('https://raw.githubusercontent.com/cartierwrist/barsikloh.github.io/main/files/WildRune.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body, h1, h2, label, button {
        font-family: 'MyCustomFont', Arial, sans-serif;
    }

</style>
</head>
<body>
    <h1>Выбери, что ты хочешь :)</h1>
    <form id="surveyForm">
        <label>Твое имя:</label>
        <input type="text" id="name" name="name" required placeholder="Введите имя (настоящее, барсиком пж не называться): ">

        <label>Какая пицца?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ ПИЦЦУ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
       <input type="text" id="answer1" name="answer1" required>

        <label>Какие роллы?</label>
        <h2>[ЕСЛИ ТЫ НЕ ХОЧЕШЬ РОЛЛЫ, ТО ВЫБЕРИ ВАРИАНТ "НЕ БУДУ". МОЖНО ВЫБИРАТЬ НЕСКОЛЬКО ВАРИАНТОВ]</h2>
         <input type="text" id="answer2" name="answer2" required>

        <label>Что из напитков?</label>
        <h2>АЛКОГОЛЬ</h2>
        <input type="text" id="answer3" name="answer3" required>
        <h2>НЕ АЛКОГОЛЬ</h2>
        <input type="text" id="answer4" name="answer4" required>

        <label>Иные пожелания:</label>
        <h2>[можете писать что угодно]</h2>
        <input type="text" id="answer5" name="answer5" required>

        <button type="submit">Отправить ответ</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById('surveyForm');
        const messageDiv = document.getElementById('message');

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSucdd69DXjwW_24BO1pVAlQTrJeCpaJgqZpsb3HD4kSSf3mwTgFw7rY6LhLlJKsaq/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                answer1: document.getElementById('answer1').value,
                answer2: document.getElementById('answer2').value,
                answer3: document.getElementById('answer3').value,
                answer4: document.getElementById('answer4').value,
                answer5: document.getElementById('answer5').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json', // Добавьте этот заголовок
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    messageDiv.innerHTML = '<p style="color: green;">Спасибо за ответы! Постараюсь учесть все пожелания</p>';
                    form.reset();
                } else {
                    throw new Error(data.error);
                }
            })
            .catch(error => {
                console.error('Error!', error);
                messageDiv.innerHTML = '<p style="color: red;">Чет пошло не так((( попробуй еще раз, бро</p>';
            });
        });
    </script>
</body>
</html>
